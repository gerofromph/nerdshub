<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Auto-run Stacking Invincibility Power-Ups</title><style>body{margin:0;overflow:hidden;background:linear-gradient(to top,#1e90ff,#87ceeb);font-family:Arial,sans-serif}#gameCanvas{display:block;margin:0 auto;background:linear-gradient(to top,#4a90e2,#70b4f7)}#score{position:absolute;top:10px;left:10px;color:#fff;font-size:22px;font-weight:700;user-select:none;text-shadow:1px 1px 2px #000}#powerUpTimer{position:absolute;top:40px;left:10px;color:#9C27B0;font-weight:700;font-size:18px;text-shadow:1px 1px 2px #000;user-select:none;display:none}</style></head><body><div id="score">Score: 0</div><div id="powerUpTimer">Invincible!</div><canvas id="gameCanvas" width="800" height="400"></canvas><script>const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d"),scoreDisplay=document.getElementById("score"),powerUpDisplay=document.getElementById("powerUpTimer");const GRAVITY=.8,FRICTION=.8;let gameOver=!1,invincibleTimer=0,POWER_UP_TIME_INCREMENT=10*60;class Player{constructor(){this.width=40,this.height=60,this.x=50,this.y=canvas.height-this.height,this.velX=0,this.velY=0,this.speed=5,this.jumping=!1,this.frameTick=0}activateInvincibility(){invincibleTimer+=POWER_UP_TIME_INCREMENT}update(){this.velY+=GRAVITY,this.velX*=FRICTION,this.x+=this.speed,this.y+=this.velY;if(this.y+this.height>canvas.height)this.y=canvas.height-this.height,this.jumping=!1,this.velY=0;if(this.x<0)this.x=0;this.frameTick++,invincibleTimer>0&&invincibleTimer--}draw(e){const t=Math.round(this.x-e),n=Math.round(this.y);ctx.fillStyle="rgba(0,0,0,0.2)",ctx.beginPath(),ctx.ellipse(t+this.width/2,canvas.height-5,this.width/2,8,0,0,2*Math.PI),ctx.fill(),invincibleTimer>0&&Math.floor(this.frameTick/10)%2==0||((ctx.fillStyle=Math.floor(this.frameTick/15)%2==0?"#D32F2F":"#B71C1C"),ctx.strokeStyle="#000",ctx.lineWidth=2,ctx.fillRect(t,n,this.width,this.height), s*2,height:this.radius*2}}}const player=new Player;let platforms=[],coins=[],enemies=[],powerUps=[],score=0,offsetX=0,lastPlatformX=0;function createPlatform(e,t,n=canvas.height-20){const r=new Platform(e,n,t,20);return platforms.push(r),lastPlatformX=Math.max(lastPlatformX,e+t),r}function createCoinsOnPlatform(e){for(let t=Math.floor(e.width/60),n=0;n<t;n++){const r=e.x+30+n*60,o=e.y-20;coins.push(new Coin(r,o))}}function createEnemyOnPlatform(e){Math.random()<.4&&(enemies.push(new Enemy(e.x+Math.random()*(e.width-40),e.y-40,100+Math.random()*100)))}function createPowerUpOnPlatform(e){Math.random()>.5||(powerUps.push(new PowerUp(e.x+Math.random()*(e.width-24)+12,e.y-30)))}function generatePlatforms(){for(;lastPlatformX<player.x+800;){const e=100+Math.random()*150,t=lastPlatformX+50+50*Math.random(),n=canvas.height-20,l=createPlatform(t,e,n);createCoinsOnPlatform(l),createEnemyOnPlatform(l),createPowerUpOnPlatform(l),Math.random()<.7&&(function(e,t,n){const r=80+100*Math.random(),o=e+50+50*Math.random(),i=t-120;const a=createPlatform(o,r,i);createCoinsOnPlatform(a),createEnemyOnPlatform(a),createPowerUpOnPlatform(a)})(t,n)}}function cleanup(){platforms=platforms.filter(e=>e.x+e.width>player.x-200),coins=coins.filter(e=>e.x>player.x-200&&!e.collected),enemies=enemies.filter(e=>e.x+e.width>player.x-200),powerUps=powerUps.filter(e=>e.x+e.radius>player.x-200&&!e.collected)}function collisionRect(e,t){return e.x<t.x+t.width&&e.x+e.width>t.x&&e.y<t.y+t.height&&e.y+e.height>t.y}function shouldJump(){// check if enemy or gap ahead const lookahead=player.x+player.width+20;for(const e of enemies)if(e.x>player.x&&e.x<lookahead)return!0;for(const p of platforms){if(p.x>player.x&&p.x<lookahead){if(player.x+player.width<p.x)return!0;}}return!1}function update(){if(gameOver)return;player.velX=player.speed;shouldJump()&&!player.jumping&&(player.jumping=!0,player.velY=-15),player.update();let e=!1;platforms.forEach(t=>{player.velY>=0&&player.x+player.width>t.x&&player.x<t.x+t.width&&player.y+player.height>t.y&&player.y+player.height<t.y+t.height+15&&(player.y=t.y-player.height,player.velY=0,player.jumping=!1,e=!0)}),e||(player.y+player.height>=canvas.height&&(player.y=canvas.height-player.height,player.jumping=!1,player.velY=0));coins.forEach(t=>{!t.collected&&collisionRect(player.getBounds(),t.getBounds())&&(t.collected=!0,score+=10,scoreDisplay.textContent="Score: "+score)}),powerUps.forEach(t=>{!t.collected&&collisionRect(player.getBounds(),t.getBounds())&&(t.collected=!0,player.activateInvincibility())}),enemies.forEach(t=>{t.update(),!gameOver&&collisionRect(player.getBounds(),t.getBounds())&&0===invincibleTimer&&(gameOver=!0,alert(`Game Over! Final Score: ${score}`),document.location.reload())}),player.x-offsetX>400&&(offsetX=player.x-400),generatePlatforms(),cleanup(),invincibleTimer>0?(powerUpDisplay.style.display="block",powerUpDisplay.textContent=`Invincible: ${(invincibleTimer/60).toFixed(1)}s`):powerUpDisplay.style.display="none"}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height),platforms.forEach(e=>e.draw(offsetX)),coins.forEach(e=>e.draw(offsetX)),powerUps.forEach(e=>e.draw(offsetX)),enemies.forEach(e=>e.draw(offsetX)),player.draw(offsetX)}function gameLoop(){update(),draw(),gameOver||requestAnimationFrame(gameLoop)}createPlatform(0,1000,canvas.height-20),generatePlatforms(),gameLoop();</script></body></html>
