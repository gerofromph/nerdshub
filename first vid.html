<!DOCTYPE html> 
<html> 
<head>
  <title>charlie chapin</title>
  <link rel="icon" href="icon.ico" type="image/x-icon">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .glowing-text {
      color: #f90;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px #f90, 0 0 20px #f90, 0 0 30px #f90, 0 0 40px #f90, 0 0 50px #f90, 0 0 60px #f90, 0 0 70px #f90;
      margin-bottom: 20px;
    }
    .video-container {
      background-color: #000000;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #f90;
      text-align: center;
      margin-top: 20px; /* Added margin-top for clearance */
    }
    button, input[type="range"] {
      background-color: #f90;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover, input[type="range"]:hover {
      background-color: #ffb84d;
      color: white;
    }
    video {
      border-radius: 10px;
      margin-top: 20px;
    }
    input[type="range"] {
      width: 100px;
      color: white;
    }
    label {
      color: white;
    }
  </style>
</head>
<body> 

<div class="glowing-text">Welcome to the Charlie Chaplin Video</div>

<div class="glowing-text">Charlie Chaplin - The Count</div>

<div class="video-container">
  <button onclick="playPause()">Play/Pause</button> 
  <button onclick="makeBig()">Big</button>
  <button onclick="makeSmall()">Small</button>
  <button onclick="makeNormal()">Normal</button>
  <button onclick="toggleFullScreen()">Full Screen</button>
  <br><br>
  <video id="video1" width="400">
    <source src="the count-charlie chaplin.mp4" type="video/mp4">
  </video>
  <br><br>
  <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="1" onchange="setVolume()">
  <label for="volumeControl">Volume</label>
  <br><br>
  <input type="range" id="playbackRateControl" min="0.5" max="2" step="0.1" value="1" onchange="setPlaybackRate()">
  <label for="playbackRateControl">Playback Speed</label>
  <br><br>
  <input type="range" id="progressBar" min="0" max="100" step="1" value="0" onchange="seekVideo()">
  <label for="progressBar">Progress</label>
</div> 

<script> 
var myVideo = document.getElementById("video1"); 
var progressBar = document.getElementById("progressBar");

myVideo.addEventListener('timeupdate', updateProgressBar);

function playPause() { 
  if (myVideo.paused) 
    myVideo.play(); 
  else 
    myVideo.pause(); 
} 

function makeBig() { 
    myVideo.width = 560; 
} 

function makeSmall() { 
    myVideo.width = 320; 
} 

function makeNormal() { 
    myVideo.width = 420; 
} 

function setVolume() {
  var volumeControl = document.getElementById("volumeControl");
  myVideo.volume = volumeControl.value;
}

function setPlaybackRate() {
  var playbackRateControl = document.getElementById("playbackRateControl");
  myVideo.playbackRate = playbackRateControl.value;
}

function updateProgressBar() {
  var value = (100 / myVideo.duration) * myVideo.currentTime;
  progressBar.value = value;
}

function seekVideo() {
  var time = myVideo.duration * (progressBar.value / 100);
  myVideo.currentTime = time;
}

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    myVideo.requestFullscreen().catch(err => {
      alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
    });
  } else {
    document.exitFullscreen();
  }
}
</script> 

</body> 
</html>
