<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Message Box</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .message-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.3);
            text-align: center;
            border: 2px solid rgba(255, 153, 0, 0.5);
            max-width: 500px;
        }
        .nerd {
            font-size: 50px;
            color: #ffffff;
            text-shadow: 2px 2px 4px #000000;
            margin-bottom: 20px;
        }
        .logo-highlight {
            background-color: #f90;
            color: rgb(255, 255, 255);
            border-radius: 10px;
            padding: 0 10px;
        }
        .message-text {
            color: #ffffff;
            font-size: 18px;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <h1 class="nerd">Nerd<span class="logo-highlight">Hub</span></h1>
